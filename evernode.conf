CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y

#CONFIG_DEBUG=y
#CONFIG_LOG=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_POWEROFF=n

CONFIG_MAIN_STACK_SIZE=8192
# LFS on our storage requires 8192 bytes per open file
# (8192 * 4 + 256) enables 4 files concurrently open
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=33024

CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
